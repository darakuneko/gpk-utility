name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies for native modules
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev libx11-dev

      - run: npm ci
      - run: npm run build
